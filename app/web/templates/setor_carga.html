<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planeamento · Carga e turnos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/planning_hub.css">
  <link rel="stylesheet" href="/static/planning_typography.css">
  <link rel="stylesheet" href="/static/setor_carga.css?v={{ version }}">
  <script src="/static/setor_carga.js?v={{ version }}" defer></script>
  <link rel="stylesheet" href="/static/planeamento_ui.css?v=20261002">
</head>
<body>
  {% set active = 'carga' %}{% include "_app_nav.html" %}
  <main class="load">
    <header class="load-head">
      <h1>Carga e turnos</h1>
      <label>Setor
        <select id="setor">{% for key, label in sectors.items() %}<option value="{{ key }}"{% if key == 'cantoneiras' %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
      </label>
      <button type="button" id="apply-all" class="apply" hidden>Aplicar todas: mais turnos</button>
      <button type="button" id="apply-less" class="apply" hidden>Aplicar todas: menos turnos</button>
      <a href="/planeamento/setor/definicoes">Definições →</a>
    </header>
    <div class="tabs" role="tablist" aria-label="Vista">
      <button type="button" role="tab" id="tab-semanas" aria-selected="true">Semanas</button>
      <button type="button" role="tab" id="tab-maquinas" aria-selected="false" hidden>Máquinas</button>
    </div>
    <p id="notice" class="notice" role="status" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="weeks-view">
      <p class="legend muted">Cada célula: <b>carga / capacidade</b> da semana. <span class="sw folga"></span> folga · <span class="sw apertado"></span> apertado · <span class="sw falta"></span> falta. Clica numa célula para ver as OF e mudar os turnos.</p>
      <div class="grid-wrap"><table class="loadgrid"><thead id="head"></thead><tbody id="body"></tbody></table></div>
      <div id="no-calendar" class="no-calendar" hidden></div>
      <section id="detail" class="detail" hidden></section>
    </div>
    <div id="machines-view" hidden>
      <p class="legend muted">Todo o trabalho aberto de cada máquina. Passa o cursor numa linha para ver o resto.</p>
      <div class="grid-wrap"><table class="orders machines" id="machines-table"></table></div>
      <p class="muted" id="machines-note"></p>
    </div>
  </main>
</body>
</html>
