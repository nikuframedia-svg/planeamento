<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAW · Planeamento de Perfis</title><link rel="stylesheet" href="/static/planning_raw.css"><script src="/static/planning_raw.js" defer></script><link rel="stylesheet" href="/static/planning_typography.css">
</head>
<body><header><a href="/planeamento">METALOGALVA <small>Planeamento</small></a><nav><a href="/planeamento">OFs</a><a href="/planeamento/manual">Preencher manualmente</a><a href="/planeamento/dossies">Carregar PDF</a></nav></header>
<main><div class="heading"><div><p class="eyebrow">Perfis / Tabela de trabalho</p><h1>RAW <span>Planeamento de Perfis</span></h1></div><button id="refresh">Atualizar lista</button></div><p id="source">A consultar as fontes…</p><p id="notice" role="status" aria-live="polite"></p>
<form id="filters"><label>Pesquisar<input name="q" placeholder="OF, OV, cliente ou referência"></label><label>Estado CPIS<select name="state"><option value="all">Todos, incluindo histórico</option><option value="open">Abertas / em produção</option><option>Fechada</option><option>Pronta</option></select></label><label>Máquina<select name="machine"><option value="">Todas</option></select></label><label>Perfil nível 1<select name="material_type"><option value="">Todos</option></select></label><label>Origem<select name="origin"><option value="">Todas</option><option value="macro">Macro</option><option value="local">Preparação local</option></select></label><label class="check"><input type="checkbox" name="pending" value="1"> Por confirmar</label><button>Filtrar</button></form>
<div class="toolbar"><details><summary>Colunas visíveis</summary><div id="groups"></div></details><select id="views" aria-label="Vistas guardadas"><option value="">Vistas guardadas</option></select><button id="save-view">Guardar vista</button><button id="analyse" class="primary">Analisar estes dados</button><select id="reports" aria-label="Análises guardadas"><option value="">Análises guardadas</option></select></div>
<div class="legend">Duplo clique ou Enter numa célula editável para preencher. <span>Valores da macro e produção: consulta. — = desconhecido; 0 = zero registado.</span></div>
<div class="grid" tabindex="0" aria-label="Tabela RAW com deslocamento horizontal"><table id="sheet"><thead></thead><tbody></tbody></table></div><div class="pager"><button id="prev">Anterior</button><span id="count"></span><button id="next">Seguinte</button></div>
</main><dialog id="panel"><button id="close-panel" class="close" aria-label="Fechar painel">×</button><div id="panel-content"></div></dialog>
<dialog id="cell"><form id="cell-form"><h2 id="cell-title"></h2><div id="cell-control"></div><p id="cell-error" role="alert"></p><button class="primary">Guardar rascunho</button><button type="button" id="cancel-cell">Cancelar</button></form></dialog>
</body></html>
